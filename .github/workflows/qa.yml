name: QA e Segurança (PHP/WordPress)

# Roda em Pull Requests e em commits nas branches principais.
on:
  push:
    branches: [ "main", "master", "v2.0" ]
  pull_request:
    branches: [ "main", "master", "v2.0" ]

permissions:
  contents: read

# Um commit novo cancela a verificação anterior da mesma branch.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php-versions }} (PHPCS, PHPStan, PHPUnit)
    runs-on: ubuntu-latest

    # O plugin declara PHP 7.4+, então roda nas versões que ele promete suportar.
    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '7.4', '8.0', '8.1', '8.2', '8.3' ]

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: composer:v2, cs2pr

      - name: Validar composer.json
        run: composer validate --strict

      - name: Instalar dependências (Composer)
        run: composer install --prefer-dist --no-progress

      # 1. Estilo, segurança e i18n do WordPress, e compatibilidade com PHP 7.4+.
      #    cs2pr põe os alertas no Pull Request, linha a linha. Só erros reprovam: os avisos
      #    (conhecidos e justificados) aparecem, mas não derrubam o job (--graceful-warnings).
      - name: PHPCS (WordPress Coding Standards)
        run: vendor/bin/phpcs -q --report=checkstyle | cs2pr --graceful-warnings

      # 2. Análise estática.
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G --error-format=github

      # 3. Testes unitários.
      - name: PHPUnit
        run: vendor/bin/phpunit --no-coverage

  mutation:
    name: Testes de mutação (Infection)
    runs-on: ubuntu-latest
    needs: php
    # Informativo por enquanto: a suíte PHP ainda é pequena e o índice de
    # mutação baixo. Tirar o continue-on-error quando o MSI mínimo for definido.
    continue-on-error: true

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar PHP com cobertura
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # o Infection atual exige PHP ^8.3
          coverage: xdebug
          tools: composer:v2, infection

      - name: Instalar dependências (Composer)
        run: composer install --prefer-dist --no-progress

      - name: PHPUnit com cobertura
        run: vendor/bin/phpunit --coverage-xml=build/logs/coverage-xml --log-junit=build/logs/junit.xml

      - name: Infection
        run: infection --threads=4 --coverage=build/logs --skip-initial-tests --show-mutations --no-progress

  javascript:
    name: JavaScript (leitor, tutor, tour, acessibilidade)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar jsdom
        run: npm install --no-save --no-audit --no-fund jsdom

      - name: Rodar os testes
        # Sem aspas: o Node 20 não expande "*" sozinho (isso só existe a partir do Node 21); quem expande é o shell.
        run: node --test documentacao/testes/*.test.js

      # Os mesmos testes sobre os arquivos .min.js, como o pacote os entrega.
      # O a11y.test.js lê o texto do código-fonte (nomes de funções, comentários), por isso fica de fora.
      - name: Minificar CSS e JS
        run: bash bin/minify-assets.sh

      - name: Rodar os testes sobre os arquivos minificados
        run: |
          node --require ./documentacao/testes/min-loader.js --test $(ls documentacao/testes/*.test.js | grep -v a11y.test.js)
