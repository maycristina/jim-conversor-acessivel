name: Site E2E (Playwright)

# Testes de interface do site (docs/): landing, documentação e apresentação em 5 larguras de tela,
# e a checagem de veracidade do texto contra o código do plugin.
# Só roda onde a pasta _privado existe (o repositório público não a traz).
on:
  push:
    paths: ['docs/**', '_privado/e2e/**', '_privado/landing/**', '_privado/verificacao/**', 'includes/**', 'admin/**', '.github/workflows/site-e2e.yml']
  pull_request:
    paths: ['docs/**', '_privado/e2e/**', '_privado/landing/**', '_privado/verificacao/**', 'includes/**', 'admin/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: ${{ hashFiles('_privado/e2e/package.json') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [mobile-320, mobile-390, tablet-768, desktop-1280, desktop-1920]
    defaults:
      run:
        working-directory: _privado/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: _privado/e2e/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=${{ matrix.project }}
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.project }}
          path: |
            _privado/e2e/playwright-report
            _privado/e2e/test-results
          retention-days: 7
